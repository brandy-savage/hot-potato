# Hot Potato — default capability policy
# First matching rule wins. Evaluation is top-down.
# Override by placing additional .yaml files in this directory.
#
# Outcomes:
#   allow               — permit execution
#   deny                — block; model receives error
#   redact              — strip sensitive args before execution
#   require_human_review — queue for human approval
#   sandbox_only        — execute inside isolated sandbox only
#   shadow_execute      — execute but do not return result to model

rules:

  # ── Unconditional blocks (all trust levels) ──────────────────────────────

  - id: block_crypto
    description: Block all crypto operations regardless of source
    match:
      tools: ["send_crypto", "get_private_key", "sign_transaction", "approve_token",
              "get_wallet_balance", "list_wallets"]
      trust_levels: ["*"]
    outcome: require_human_review
    reason: "Crypto/wallet operations always require explicit human approval"

  - id: block_shell_from_untrusted
    description: Block shell execution when triggered by untrusted content
    match:
      tools: ["bash_exec", "execute_code", "execute_shell", "run_command", "shell", "subprocess"]
      trust_levels: [UNTRUSTED, SEMI_TRUSTED]
    outcome: deny
    reason: "Shell execution from untrusted content is arbitrary code execution"

  # ── Exfiltration prevention ───────────────────────────────────────────────

  - id: block_exfil_untrusted
    description: Block all outbound network from untrusted content
    match:
      tools: ["http_request", "send_http", "send_email", "post_webhook", "upload_file"]
      trust_levels: [UNTRUSTED]
    outcome: deny
    reason: "Outbound network from UNTRUSTED content is exfiltration"

  - id: block_exfil_signals
    description: Block network ops when injection signals are present
    match:
      tools: ["http_request", "send_http", "send_email", "post_webhook", "upload_file"]
      trust_levels: [UNTRUSTED, SEMI_TRUSTED]
      taint_tags: ["injection_signal"]
    outcome: deny
    reason: "Injection signals detected; blocking outbound network call"

  # ── URL parameter laundering ─────────────────────────────────────────────
  # Closes the attack: model trained/prompted to emit
  #   https://trusted-domain.com/api?d=<exfil>
  # The base domain looks fine but GET params carry stolen data.
  # Applies even when effective_trust_level is TRUSTED because the URL
  # was AI-generated — the model's "memory" is not a trusted source.

  - id: block_url_param_exfil_fragment
    description: Block outbound when URL params contain verbatim tainted content
    match:
      tools: ["http_request", "send_http", "post_webhook", "upload_file"]
      trust_levels: ["*"]
      taint_tags: ["url_param_taint_fragment"]
    outcome: deny
    reason: "URL query parameters contain content from tainted inputs — likely exfiltration via GET params"

  - id: review_ai_url_param_tainted
    description: Require review for AI-generated URLs with suspicious params
    match:
      tools: ["http_request", "send_http", "post_webhook", "upload_file"]
      trust_levels: ["*"]
      taint_tags: ["url_param_tainted", "url_ai_generated"]
    outcome: require_human_review
    reason: "AI-generated URL has query parameters that look like encoded payload — possible training-data-poisoned C2 call"

  - id: review_exfil_semi_trusted
    description: Require review for network ops from semi-trusted content
    match:
      tools: ["http_request", "send_http", "send_email", "post_webhook", "upload_file"]
      trust_levels: [SEMI_TRUSTED]
    outcome: require_human_review
    reason: "Network ops from SEMI_TRUSTED content require human review"

  # ── Write operations ─────────────────────────────────────────────────────

  - id: sandbox_writes_untrusted
    description: Sandbox filesystem writes from untrusted content
    match:
      tools: ["write_file", "write_memory", "create_file", "append_file"]
      trust_levels: [UNTRUSTED]
    outcome: sandbox_only
    reason: "Filesystem writes from UNTRUSTED content confined to sandbox"

  - id: review_writes_injection
    description: Human review for writes when injection signals present
    match:
      tools: ["write_file", "write_memory"]
      trust_levels: [UNTRUSTED, SEMI_TRUSTED]
      taint_tags: ["instruction_flow"]
    outcome: require_human_review
    reason: "Instruction-flow signal detected before write operation"

  # ── Authority/privilege escalation ───────────────────────────────────────

  - id: block_priv_esc
    description: Block any action when privilege escalation is detected
    match:
      tools: ["*"]
      trust_levels: [UNTRUSTED, SEMI_TRUSTED]
      taint_tags: ["privilege_escalation"]
    outcome: deny
    reason: "Privilege escalation signal — blocking all capability access"

  - id: block_authority_shift
    description: Deny tool calls when authority shift is detected
    match:
      tools: ["*"]
      trust_levels: [UNTRUSTED]
      taint_tags: ["authority_shift"]
    outcome: deny
    reason: "Authority shift signal from UNTRUSTED source — denying capability"

  # ── Safe read operations ─────────────────────────────────────────────────

  - id: shadow_read_untrusted
    description: Shadow-execute reads from untrusted content (log but allow)
    match:
      tools: ["read_file", "list_dir", "get_env"]
      trust_levels: [UNTRUSTED]
      taint_tags_absent: ["injection_signal", "instruction_flow"]
    outcome: shadow_execute
    reason: "Read-only from clean UNTRUSTED content — shadow executing"

  - id: allow_reads_semi_trusted
    description: Allow reads from semi-trusted clean content
    match:
      tools: ["read_file", "list_dir"]
      trust_levels: [SEMI_TRUSTED]
      taint_tags_absent: ["injection_signal"]
    outcome: allow
    reason: "Read-only from clean SEMI_TRUSTED content"

  - id: allow_trusted
    description: Allow all operations from trusted/system sources
    match:
      tools: ["*"]
      trust_levels: [TRUSTED, SYSTEM]
    outcome: allow
    reason: "Trusted/system source — no restrictions"
